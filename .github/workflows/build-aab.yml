name: Build ISKORA Fermata AAB

on:
  workflow_dispatch:
    inputs:
      version_code:
        description: "Android versionCode (her yüklemede artır)"
        required: true
        default: "10001"
      version_name:
        description: "Görünen sürüm"
        required: true
        default: "1.0.0"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check signing secrets
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ISKORA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ISKORA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ISKORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ISKORA_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          for name in KEYSTORE_B64 STORE_PASSWORD KEY_ALIAS KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "Missing signing secret: $name"
              exit 1
            fi
          done

      - name: Clone official Fermata source
        run: |
          git clone --depth 1 --recurse-submodules --shallow-submodules \
            https://github.com/AndreyPavlenko/Fermata.git Fermata

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: Fermata/**/*.gradle*

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install required Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0" "platform-tools"

      - name: Configure version and signing
        working-directory: Fermata
        shell: bash
        env:
          KEYSTORE_B64: ${{ secrets.ISKORA_KEYSTORE_B64 }}
          STORE_PASSWORD: ${{ secrets.ISKORA_STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ISKORA_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ISKORA_KEY_PASSWORD }}
          VERSION_CODE: ${{ inputs.version_code }}
          VERSION_NAME: ${{ inputs.version_name }}
        run: |
          set -euo pipefail
          echo "$KEYSTORE_B64" | base64 --decode > iskora-upload.jks

          cat > local.properties <<EOF
          sdk.dir=$ANDROID_SDK_ROOT
          storeFile=$GITHUB_WORKSPACE/Fermata/iskora-upload.jks
          storePassword=$STORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

          sed -i -E "s/appVersionCode = \"[0-9]+\"/appVersionCode = \"$VERSION_CODE\"/" gradle/libs.versions.toml
          sed -i -E "s/appVersionName = \"[^\"]+\"/appVersionName = \"$VERSION_NAME\"/" gradle/libs.versions.toml

      - name: Build signed Auto release AAB
        working-directory: Fermata
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon --stacktrace bundleAutoRelease \
            -PAPP_ID=com.iskora.fermata \
            -PAPP_NAME="ISKORA Fermata Test"

      - name: Verify package and signature
        working-directory: Fermata
        shell: bash
        run: |
          set -euo pipefail
          AAB=$(find fermata/build/outputs/bundle/autoRelease -name "*.aab" -print -quit)
          test -n "$AAB"
          jarsigner -verify -verbose -certs "$AAB" >/dev/null
          mkdir -p "$GITHUB_WORKSPACE/output"
          cp "$AAB" "$GITHUB_WORKSPACE/output/iskora-fermata-auto-${{ inputs.version_name }}-${{ inputs.version_code }}.aab"
          cat > "$GITHUB_WORKSPACE/output/build-info.txt" <<EOF
          Application ID: com.iskora.fermata.auto
          App name: ISKORA Fermata Test
          Version name: ${{ inputs.version_name }}
          Version code: ${{ inputs.version_code }}
          Upstream: https://github.com/AndreyPavlenko/Fermata
          EOF

      - name: Upload Play Console bundle
        uses: actions/upload-artifact@v4
        with:
          name: iskora-fermata-play-upload
          path: output/
          if-no-files-found: error
          retention-days: 14
