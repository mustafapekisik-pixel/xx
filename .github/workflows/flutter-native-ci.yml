name: Flutter Native CI

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.7"
          channel: stable
          cache: true

      - name: Generate missing Flutter scaffold files
        run: |
          flutter create \
            --platforms=android \
            --org com.iskora \
            --project-name iskora_drive \
            --overwrite \
            .
          git restore --source=HEAD -- .

      - name: Resolve dependencies
        run: flutter pub get

      - name: Build release app bundle
        run: flutter build appbundle --release

      - name: Run tests
        run: flutter test

      - name: Analyze
        continue-on-error: true
        run: flutter analyze

      - name: Upload AAB
        uses: actions/upload-artifact@v4
        with:
          name: iskora-drive-flutter-aab
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14